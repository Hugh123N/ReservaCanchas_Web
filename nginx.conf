worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Upstream SSR
    upstream ssr {
        server 127.0.0.1:4000;
    }

    server {
        listen 80;
        server_name reservafast.com www.reservafast.com;

        # Headers de seguridad
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Archivos estáticos del browser
        location /browser/ {
            alias /app/browser/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Archivos estáticos de assets
        location /assets/ {
            alias /app/browser/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # robots.txt
        location = /robots.txt {
            alias /app/browser/robots.txt;
            add_header Content-Type text/plain;
            access_log off;
        }

        # Favicon
        location = /favicon.ico {
            alias /app/browser/favicon.ico;
            access_log off;
            log_not_found off;
        }

        # Redirect legacy URLs
        location = /cancha/canchas {
            return 301 /canchas;
        }

        # Redirect canonical (ciudad/deporte siempre primero)
        location ~ ^/(futbol|padel|tenis|voleibol|baloncesto)/([\w-]+)$ {
            return 301 /$2/$1;
        }

        # Todo lo demás → SSR
        location / {
            proxy_pass http://ssr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
