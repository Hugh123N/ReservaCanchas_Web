<mat-card class="field-card flex flex-col gap-3">
  <!-- Imagen -->
  <div
    class="image-container relative h-44 overflow-hidden rounded-t-xl"
    [class.unavailable]="!disponible"
    >
    <img
      [src]="mainImage"
      alt="{{ field.nombre }}"
      class="w-full h-full object-cover"
      />
      @if (estadoTexto) {
        <span
          class="status-badge absolute top-2 left-2 bg-red-600 text-white px-2 py-1 rounded-md text-xs font-medium"
          >
          {{ estadoTexto }}
        </span>
      }
    </div>

    <!-- Contenido -->
    <mat-card-content class="flex flex-col gap-2">
      <!-- Título y favorito -->
      <div class="flex justify-between items-center">
        <h3 class="font-semibold text-lg flex-1 mr-2">{{ field.nombre }}</h3>
        <button
          mat-icon-button
          class="heart-button !w-9 !h-9 flex-shrink-0"
          (click)="onToggleFavorito($event)"
          [attr.aria-label]="esFavorito() ? 'Quitar de favoritos' : 'Agregar a favoritos'"
        >
          <mat-icon [class.!text-red-500]="esFavorito()" [class.!text-gray-400]="!esFavorito()">
            {{ esFavorito() ? 'favorite' : 'favorite_border' }}
          </mat-icon>
        </button>
      </div>

      <!-- Ubicación -->
      <div class="flex items-center text-gray-600 text-sm">
        <mat-icon class="text-base mr-1">location_on</mat-icon>
        <span>{{ ubicacion }}</span>
      </div>

      <!-- Deporte -->
      <mat-chip color="primary" selected>{{ deporte }}</mat-chip>

      <!-- Precio -->
      <div class="price font-bold text-primary flex items-baseline gap-1">
        <span class="amount text-xl">S/ {{ field.precioHora }}</span>
        <span class="text-sm">/hora</span>
      </div>

      <!-- Horarios -->
      <div class="flex items-center text-gray-700 text-sm">
        <mat-icon class="text-base mr-1">schedule</mat-icon>
        <span>Horarios: {{ horarios.join(", ") }}</span>
      </div>
    </mat-card-content>

    <!-- Botón -->
    <mat-card-actions>
      @if (disponible) {
        <button
          mat-raised-button
          class="w-full btn-white-primary"
          (click)="verDetalle(field.idCancha!)"
          >
          Reservar Ahora
        </button>
      } @else {
        <button mat-raised-button disabled class="w-full !rounded-lg">No Disponible</button>
      }
    </mat-card-actions>
  </mat-card>
