<div class="filtros-modal-container">
  <!-- Header -->
  <div class="modal-header">
    <h2 class="text-lg font-semibold">Filtros</h2>
    <button mat-icon-button (click)="cerrar()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Content -->
  <div class="modal-content">
    <form [formGroup]="filtrosForm">
      <!-- Tipo de Deporte -->
      <section class="content-card">
        <h3 class="section-title">Tipo de Deporte</h3>
        <div class="relative">
          <select formControlName="idTipoCancha" class="select-base">
            <option [ngValue]="null">Todos los deportes</option>
            @for (tipo of data.tipoDeportes; track tipo.idTipoDeporte) {
              <option [ngValue]="tipo.idTipoDeporte">{{ tipo.nombre }}</option>
            }
          </select>
          <mat-icon class="select-dropdown-icon">expand_more</mat-icon>
        </div>

        <h3 class="section-title">Ubicación</h3>
        <div class="relative">
          <select formControlName="codigoUbigeo" class="select-base">
            <option [ngValue]="null">Todas las ubicaciones</option>
            @for (ubigeo of data.ubigeos; track ubigeo.codigoUbigeo) {
              <option [ngValue]="ubigeo.codigoUbigeo">{{ ubigeo.distrito }}, {{ ubigeo.provincia }}</option>
            }
          </select>
          <mat-icon class="select-dropdown-icon">expand_more</mat-icon>
        </div>
     
        <h3 class="section-title">Favoritos</h3>
        <mat-slide-toggle
          formControlName="soloFavoritos"
          color="primary"
          class="w-full!"
        >
          <div class="toggle-label">
            <span>Favoritos</span>
            @if (data.cantidadFavoritos > 0) {
              <span class="badge-count-inline">({{ data.cantidadFavoritos }})</span>
            }
          </div>
        </mat-slide-toggle>
      </section>

      <!-- Fecha (Opcional para futuro) -->
      <!--
      <section class="content-card">
        <h3 class="section-title">Fecha</h3>
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Selecciona una fecha</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="fecha">
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </section>
      -->
    </form>
  </div>

  <!-- Footer Sticky -->
  <div class="modal-footer">
    <button
      mat-stroked-button
      class="btn-outline-primary"
      (click)="limpiarFiltros()"
    >
      Limpiar Todo
    </button>
    <button
      mat-raised-button
      class="btn-primary"
      (click)="aplicarFiltros()"
    >
      Aplicar Filtros
    </button>
  </div>
</div>
