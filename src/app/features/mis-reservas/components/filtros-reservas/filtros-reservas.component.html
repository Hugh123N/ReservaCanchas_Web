<div class="content-card p-4">
  <form [formGroup]="filtrosForm" (ngSubmit)="onAplicarFiltros()">
    <div class="flex items-center gap-3 mb-4">
      <mat-icon class="text-primary-600 icon-md">filter_alt</mat-icon>
      <h4 class="title-section text-neutral-800">Filtrar Reservas</h4>
    </div>

    <!-- Grid de Filtros -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-4">

      <!-- Estado de Reserva -->
      <div>
        <label class="form-label">
          Estado de Reserva
        </label>
        <select class="select-base" formControlName="codigoEstado">
          <option value="">Todos</option>
          @for (estado of estadosReserva; track estado.value) {
            <option [value]="estado.value">{{ estado.label }}</option>
          }
        </select>
      </div>

      <!-- Estado de Pago -->
      <div>
        <label class="form-label">
          Estado de Pago
        </label>
        <select class="select-base" formControlName="estadoPago">
          <option value="">Todos</option>
          @for (estado of estadosPago; track estado.value) {
            <option [value]="estado.value">{{ estado.label }}</option>
          }
        </select>
      </div>

      <!-- Código de Reserva -->
      <div>
        <label class="form-label">
          Código de Reserva
        </label>
        <input class="input-base" formControlName="codigoReserva" type="text" placeholder="Ej: RES-2025-0001" />
      </div>

      <!-- Nombre de Cancha -->
      <div>
        <label class="form-label">
          Nombre de Cancha
        </label>
        <input class="input-base" formControlName="nombreCancha" type="text" placeholder="Buscar por cancha" />
      </div>

      <!-- Fecha Desde -->
      <div>
        <label class="form-label">
          Fecha Desde
        </label>
        <input class="input-base" formControlName="fechaDesde" type="date" />
      </div>

      <!-- Fecha Hasta -->
      <div>
        <label class="form-label">
          Fecha Hasta
        </label>
        <input class="input-base" formControlName="fechaHasta" type="date" />
      </div>

    </div>

    <!-- Botones -->
    <div class="flex flex-col sm:flex-row gap-3 justify-end">
      <button
        type="button"
        class="btn-outline-primary"
        (click)="onLimpiar()"
        [disabled]="!hasFiltrosActivos()">
        <mat-icon class="icon-sm">filter_list_off</mat-icon>
        Limpiar
      </button>
      <button
        type="submit"
        class="btn-primary">
        <mat-icon class="icon-sm">search</mat-icon>
        Aplicar Filtros
      </button>
    </div>
  </form>
</div>
