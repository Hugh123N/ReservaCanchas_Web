<section class="content-card filters-card" aria-labelledby="reservation-filters-title">
  <div class="filters-heading"><div><h2 id="reservation-filters-title">Encuentra una reserva</h2><p>Combina los criterios que necesites.</p></div><mat-icon aria-hidden="true">tune</mat-icon></div>
  <form [formGroup]="filtrosForm" (ngSubmit)="onAplicarFiltros()">
    <div class="filters-grid">
      <div class="filter-wide"><label for="reservation-court" class="form-label">Cancha</label>
        <input id="reservation-court" class="input-base" type="search" formControlName="nombreCancha" placeholder="Nombre de la cancha" maxlength="120" />
        <app-form-error [control]="filtrosForm.controls.nombreCancha" />
      </div>
      <div class="filter-wide"><label for="reservation-code" class="form-label">Código de reserva</label>
        <input id="reservation-code" class="input-base" type="text" formControlName="codigoReserva" placeholder="Ej. RES-2026-0001" maxlength="60" />
        <app-form-error [control]="filtrosForm.controls.codigoReserva" />
      </div>
      <div><label for="reservation-status" class="form-label">Estado de reserva</label>
        <select id="reservation-status" class="select-base" formControlName="codigoEstado"><option value="">Todos los estados</option>
          @for (estado of estadosReserva; track estado.value) { <option [value]="estado.value">{{ estado.label }}</option> }
        </select>
      </div>
      <div><label for="reservation-payment" class="form-label">Estado de pago</label>
        <select id="reservation-payment" class="select-base" formControlName="estadoPago"><option value="">Todos los pagos</option>
          @for (estado of estadosPago; track estado) { <option [value]="estado">{{ estado }}</option> }
        </select>
      </div>
      <div><label for="reservation-from" class="form-label">Desde</label><input id="reservation-from" type="date" class="input-base" formControlName="fechaDesde" [max]="filtrosForm.controls.fechaHasta.value" /></div>
      <div><label for="reservation-until" class="form-label">Hasta</label><input id="reservation-until" type="date" class="input-base" formControlName="fechaHasta" [min]="filtrosForm.controls.fechaDesde.value" /></div>
      <div class="filters-actions">
        <button type="button" class="btn-outline-primary" (click)="onLimpiar()">Limpiar</button>
        <button type="submit" class="btn-primary"><mat-icon aria-hidden="true">search</mat-icon>Aplicar filtros</button>
      </div>
    </div>
    <app-form-error [control]="filtrosForm" [messages]="{ invalidDate: 'La fecha final debe ser igual o posterior a la fecha inicial.' }" />
  </form>
</section>
