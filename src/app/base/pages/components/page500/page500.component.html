<div class="error-page-container">
  <div class="error-page-card">
    <div class="flex flex-col items-center justify-center gap-6 !p-0">

      <!-- Icono y código de error -->
      <div class="flex flex-col items-center justify-center gap-2.5">
        <h1 class="error-page-code text-accent-600">500</h1>
      </div>

      <!-- Mensaje principal -->
      <div class="flex flex-col items-center justify-center gap-4">
        <h2 class="error-page-title text-center">Error Interno del Servidor</h2>
        <p class="error-page-description text-center">
          Ups! Algo salió mal en nuestros servidores. Estamos trabajando para solucionarlo.
        </p>
      </div>

      <!-- Estado de reconexión -->
      <div class="card-primary w-full min-h-[50px] flex flex-col items-center justify-center"
        [ngClass]="{'bg-accent-50 border-accent-300': isReconnecting}">

        @if (isReconnecting) {
          <div class="flex items-center justify-center gap-2 flex-wrap text-center">
            <mat-spinner diameter="20" strokeWidth="3"></mat-spinner>
            <span class="text-accent-600 font-medium text-sm sm:text-base">Reintentando conexión...</span>
          </div>
        }

        @if (!isReconnecting) {
          <div class="flex items-center gap-2 text-primary-600 text-xs sm:text-sm flex-wrap justify-center text-center">
            <mat-icon class="text-primary-600">info</mat-icon>
            <span>Última verificación: {{ lastCheck | date:'short' }}</span>
          </div>
        }
      </div>

      <!-- Botones de acción -->
      <div class="error-page-actions w-full mt-4">
        <button
          class="btn-primary w-full sm:w-auto"
          (click)="retryConnection()"
          [disabled]="isReconnecting">
          <mat-icon>refresh</mat-icon>
          Reintentar
        </button>

        <button
          class="btn-outline-primary w-full sm:w-auto"
          (click)="goHome()">
          <mat-icon>home</mat-icon>
          Ir al Inicio
        </button>

        <button 
          class="btn-outline-primary w-full sm:w-auto"
          (click)="reportError()">
          <mat-icon>bug_report</mat-icon>
          Reportar Error
        </button>
      </div>

    </div>
  </div>
</div>
