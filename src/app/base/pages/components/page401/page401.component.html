<div class="error-container" 
         fxLayout="column" 
         fxLayoutAlign="center center" 
         fxFill>
      
      <mat-card class="error-card" 
                fxLayout="column" 
                fxLayoutAlign="center center"
                fxFlex="none"
                fxFlex.xs="90"
                fxFlex.sm="70"
                fxFlex.md="50">
        
        <mat-card-content fxLayout="column" fxLayoutAlign="center center" fxLayoutGap="20px">
          
          <!-- Icono y código de error -->
          <div fxLayout="column" fxLayoutAlign="center center" fxLayoutGap="10px">
            <mat-icon class="error-icon" color="warn">lock</mat-icon>
            <h1 class="error-code">401</h1>
          </div>
          
          <!-- Mensaje principal -->
          <div class="error-content" fxLayout="column" fxLayoutAlign="center center" fxLayoutGap="15px">
            <h2 class="error-title">Acceso No Autorizado</h2>
            <p class="error-description" fxLayout="column" fxLayout.gt-xs="row" fxLayoutAlign="center center">
              <span>No tienes permisos para acceder a esta página.</span>
              <span fxHide.xs fxShow.gt-xs>&nbsp;</span>
              <span>Por favor, inicia sesión para continuar.</span>
            </p>
          </div>
          
          <!-- Botones de acción -->
          <div class="error-actions" 
               fxLayout="column" 
               fxLayout.gt-xs="row" 
               fxLayoutAlign="center center" 
               fxLayoutGap="15px"
               fxLayoutGap.gt-xs="20px">
            
            <button mat-raised-button 
                    color="primary" 
                    (click)="goToLogin()"
                    fxFlex.xs="100"
                    fxFlex.gt-xs="none">
              <mat-icon>login</mat-icon>
              Iniciar Sesión
            </button>
            
            <button mat-stroked-button 
                    color="accent" 
                    (click)="goHome()"
                    fxFlex.xs="100"
                    fxFlex.gt-xs="none">
              <mat-icon>home</mat-icon>
              Ir al Inicio
            </button>
            
          </div>
          
        </mat-card-content>
      </mat-card>
      
    </div>
