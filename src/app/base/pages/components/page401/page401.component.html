<div class="error-page-container">
  <div class="error-page-card">
    <div class="flex flex-col items-center justify-center gap-5 !p-0">

      <!-- Icono y código de error -->
      <div class="flex flex-col items-center justify-center gap-2.5">
        <h1 class="error-page-code text-accent-600">401</h1>
      </div>

      <!-- Mensaje principal -->
      <div class="flex flex-col items-center justify-center gap-4">
        <h2 class="error-page-title text-center">Acceso No Autorizado</h2>
        <p class="error-page-description text-center">
          No tienes permisos para acceder a esta página. Por favor, inicia sesión para continuar.
        </p>
      </div>

      <!-- Botones de acción -->
      <div class="error-page-actions w-full">
        <button mat-raised-button class="btn-primary w-full sm:w-auto" (click)="goToLogin()">
          <mat-icon>login</mat-icon>
          Iniciar Sesión
        </button>

        <button mat-stroked-button class="btn-outline-primary w-full sm:w-auto" (click)="goHome()">
          <mat-icon>home</mat-icon>
          Ir al Inicio
        </button>
      </div>

    </div>
  </div>
</div>
