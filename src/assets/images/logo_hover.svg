<svg width="140" height="140" viewBox="85 55 130 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Definir gradiente blanco -->
  <defs>
    <linearGradient id="hexGradientWhite" x1="150" y1="60" x2="150" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  
  <!-- Hexágono exterior -->
  <path 
    d="M150 60 L210 95 L210 165 L150 200 L90 165 L90 95 Z"
    fill="url(#hexGradientWhite)"
    stroke="#ffffff" 
    stroke-width="10" 
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  
  <!-- Cancha interior rectangular -->
  <rect 
    x="120" 
    y="80" 
    width="60" 
    height="105" 
    rx="4"
    fill="none"
    stroke="#ffffff" 
    stroke-width="6" 
  />
  
  <!-- Línea central de cancha -->
  <line 
    x1="120" 
    y1="132.5" 
    x2="180" 
    y2="132.5" 
    stroke="#ffffff" 
    stroke-width="5"
    stroke-linecap="round"
  />
  
  <!-- Círculos de media cancha -->
  <circle 
    cx="150" 
    cy="106" 
    r="12" 
    stroke="#ffffff" 
    stroke-width="4" 
    fill="none"
  />
  <circle 
    cx="150" 
    cy="159" 
    r="12" 
    stroke="#ffffff" 
    stroke-width="4" 
    fill="none"
  />
  
  <!-- Punto central -->
  <circle 
    cx="150" 
    cy="132.5" 
    r="6" 
    fill="#ffffff"
  />
</svg>
